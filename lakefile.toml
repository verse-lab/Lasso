name = "LTLLib"
version = "0.1.0"
defaultTargets = ["LTLLib"]
testDriver = "LTLLibTests"

[[require]]
name = "lentil"
git = "https://github.com/verse-lab/Lentil.git"
rev = "6a28e7d20bf9319ca083e4dffd587bd668553396"

[[require]]
name = "batteries"
git = "https://github.com/leanprover-community/batteries"
rev = "v4.32.0"

[[lean_lib]]
name = "LTLLib"

[[lean_lib]]
name = "LTLLibTests"
globs = ["LTLLibTests.+"]

[[lean_exe]]
name = "tgbabench"
root = "LTLLib.Benchmark.PipelineBench"

[[lean_exe]]
name = "fairbench"
root = "LTLLib.Benchmark.FairnessBench"

[[lean_exe]]
name = "fairmatrix"
root = "LTLLib.Benchmark.FairnessMatrix"

[[lean_exe]]
name = "simpbench"
root = "LTLLib.Benchmark.SimplifyBench"

[[lean_exe]]
name = "ltl3bench"
root = "LTLLib.LTLtoTGBA.Benchmark.TranslationBench"
