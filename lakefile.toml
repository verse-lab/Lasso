name = "Lasso"
version = "0.1.0"
defaultTargets = ["Lasso"]
testDriver = "LassoTests"

[[require]]
name = "lentil"
git = "https://github.com/verse-lab/Lentil.git"
rev = "6a28e7d20bf9319ca083e4dffd587bd668553396"

[[require]]
name = "batteries"
git = "https://github.com/leanprover-community/batteries"
rev = "v4.32.0"

[[lean_lib]]
name = "Lasso"

[[lean_lib]]
name = "LassoTests"
globs = ["LassoTests.+"]

[[lean_exe]]
name = "tgbabench"
root = "Lasso.Benchmark.PipelineBench"

[[lean_exe]]
name = "fairbench"
root = "Lasso.Benchmark.FairnessBench"

[[lean_exe]]
name = "fairmatrix"
root = "Lasso.Benchmark.FairnessMatrix"

[[lean_exe]]
name = "simpbench"
root = "Lasso.Benchmark.SimplifyBench"

[[lean_exe]]
name = "ltl3bench"
root = "Lasso.LTLtoTGBA.Benchmark.TranslationBench"
