name = "LTLLib"
version = "0.1.0"
defaultTargets = ["LTLLib"]

[[require]]
name = "lentil"
git = "https://github.com/verse-lab/Lentil.git"
rev = "v4.28.0"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"

[[lean_lib]]
name = "LTLLib"

[[lean_exe]]
name = "tgbabench"
root = "LTLLib.TGBABased.Benchmark.PipelineBench"

[[lean_exe]]
name = "fairbench"
root = "LTLLib.TGBABased.Benchmark.FairnessBench"

[[lean_exe]]
name = "fairmatrix"
root = "LTLLib.TGBABased.Benchmark.FairnessMatrix"

[[lean_exe]]
name = "simpbench"
root = "LTLLib.TGBABased.Benchmark.SimplifyBench"

[[lean_exe]]
name = "ltl3bench"
root = "LTLLib.TGBABased.LTLtoTGBA.Benchmark.TranslationBench"
